<!-- Only admins can see Add Trip -->
<button type="button"
        *ngIf="isAdmin()"
        (click)="addTrip()"
        class="btn btn-info">
        Add Trip
</button>
 <!-- show trip count or error message -->
<p>
  {{ message }}
</p>

<div *ngFor="let trip of trips">

  <!-- Give one trip to TripCardComponent then listen for a succesful delete -->
  <app-trip-card
    [trip]="trip"

    (tripChanged)="refreshTrips()">
  </app-trip-card>
    
</div>
